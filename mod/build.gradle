plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.mod_id
}

// Release version: <mod version>+<Minecraft version> (e.g. 0.1.0+26.3), used for the jar name
// and expanded into fabric.mod.json. planner-core keeps the plain version.
version = "${project.version}+${project.minecraft_version}"

loom {
	runs {
		// Dedicated server for scripts/server-only-test.sh (own run dir; the script writes
		// server.properties and eula.txt there, see docs/research/spikes/server-only.md).
		serverOnly {
			server()
			runDir "build/run/serverOnly"
			ideConfigGenerated false
		}
	}
	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

fabricApi {
	// Creates the `gametest` source set (its own fabric.mod.json) and the
	// runGameTest (server) and runClientGameTest (client) tasks.
	configureTests {
		createSourceSet = true
		modId = "fractalbuildings-test"
		enableGameTests = true
		enableClientGameTests = true
		clearRunDirectory = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// planner-core is pure Java; it is bundled into the mod jar as jar-in-jar.
	implementation project(':planner-core')
	include project(':planner-core')

	// Plain JUnit tests that bootstrap vanilla worldgen without a server (TerrainDumpTool).
	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Ship the licence at the root of the mod jar and the sources jar.
tasks.named("jar") {
	from(rootProject.file("LICENSE"))
}
tasks.named("sourcesJar") {
	from(rootProject.file("LICENSE"))
}

// Keep client game test screenshots at a stable path that other tasks' run-dir cleanup can't wipe.
tasks.named('runClientGameTest') {
	// Headless only: with WAYLAND_DISPLAY set (a logged-in GNOME session) SDL picks Wayland
	// over Xvfb and the client dies at the first frame. runClient is left alone on purpose.
	environment.remove('WAYLAND_DISPLAY')
	environment 'SDL_VIDEODRIVER', 'x11'
	doLast {
		copy {
			from layout.buildDirectory.dir('run/clientGameTest/screenshots')
			into layout.buildDirectory.dir('screenshots')
			rename { it.replaceFirst(/^\d+_/, '') }
		}
	}
}

// Server game tests start from a fresh world (TESTISO): Fabric's runner opens the run dir's `world` as it is, so without this
// the chunks, villagers and POIs one run saved are loaded into the next (vanilla's GameTestMainUtil resets its universe too).
tasks.named('runGameTest') {
	doFirst { delete layout.buildDirectory.dir('run/gameTest/world') }
	// -Pfb.gametestFilter=<selector> runs only the matching server tests (e.g. 'fractalbuildings-test:worldgen_game_test_*')
	if (findProperty('fb.gametestFilter')) systemProperty 'fabric-api.gametest.filter', findProperty('fb.gametestFilter')
}

// TESTLAYERS: the district-order test (B2) on a renderer-free dedicated server, one fresh world per run. scripts/order-test.sh runs
// :mod:runOrderServer once per run label (-Pfb.orderRun=<label>, own run dir build/run/order/<label>, results in -Pfb.orderOut=<dir>),
// several Gradle processes at a time. OrderServerHarness is loaded by the mod's -Dfb.testHook (shared with the PERFSRV harness) and
// halts the server when its verdict is written. The hook text in FractalBuildingsMod is identical in PERFSRV's branch.
def orderRun = (findProperty('fb.orderRun') ?: 'forward').toString()
loom.runs {
	orderServer {
		server()
		source sourceSets.gametest
		runDir "build/run/order/${orderRun}"
		ideConfigGenerated false
		property 'fb.testHook', 'dev.fractalbuildings.gametest.order.OrderServerHarness'
		property 'fb.order.run', orderRun
		property 'fb.order.out', (findProperty('fb.orderOut') ?: layout.buildDirectory.dir('order').get().asFile.path).toString()
		property 'fb.order.radius', (findProperty('fb.orderRadius') ?: '1').toString()
	}
}

// PORTALCOLD: a dedicated server per case (-Pfb.portalCase=town|metro|wild; scripts/portalcold.sh), run dir build/run/portalcold/<case>.
loom.runs {
	portalColdServer {
		server()
		source sourceSets.gametest
		runDir "build/run/portalcold/${(findProperty('fb.portalCase') ?: 'town')}"
		ideConfigGenerated false
		property 'fb.testHook', 'dev.fractalbuildings.gametest.perf.PortalColdHarness'
		property 'fb.portal.case', (findProperty('fb.portalCase') ?: 'town').toString()
		property 'fb.portal.out', (findProperty('fb.portalOut') ?: layout.buildDirectory.dir('portalcold').get().asFile.path).toString()
	}
}

// Forward -Dfb.* options to the test JVM (e.g. -Dfb.dump=12345:0:0:64:384:384:name).
tasks.named('test') {
	useJUnitPlatform()
	maxHeapSize = '2g'
	systemProperties System.properties.findAll { it.key.toString().startsWith('fb.') }
	testLogging { showStandardStreams = true }
}

// --- Compatibility matrix (plan B7): worldgen mods as test-only runtime dependencies -----------------------------
// -PmodSet=vanilla|lithostitched|terralith|tectonic|terratectonic|terrablender   (default vanilla: nothing is downloaded)
// Jars come from scripts/fetch-test-mods.sh (cache ~/.cache/fractal-test-mods, or $FRACTAL_TEST_MODS); only the selected set's
// jars are fetched, and each is checked against the sha512 Modrinth publishes. They are run as black boxes on the test classpath
// only, never bundled. Terralith and Tectonic need Lithostitched. The test code that registers two TerraBlender regions
// (`compat/tb`) compiles against the TerraBlender jar, so it is part of the build only for -PmodSet=terrablender; the game-test
// mod's `terrablender` entrypoint is only called when that mod is loaded, so the other runs never look for the class.
def testModsDir = file(System.getenv('FRACTAL_TEST_MODS') ?: "${System.getProperty('user.home')}/.cache/fractal-test-mods")
def tmJar = [
	lithostitched: 'lithostitched-2.0.6-fabric-26.3.jar',
	terralith    : 'Terralith_26.3_v2.6.5+26.3.jar',
	tectonic     : 'tectonic-3.0.31-fabric-26.3.jar',
	terrablender : 'TerraBlender-fabric-26.3-26.3.0.0.9.jar',
]
def modSet = (findProperty('modSet') ?: 'vanilla').toString()
def modSetMods = [
	vanilla       : [],
	lithostitched : ['lithostitched'],
	terralith     : ['lithostitched', 'terralith'],
	tectonic      : ['lithostitched', 'tectonic'],
	terratectonic : ['lithostitched', 'terralith', 'tectonic'],
	terrablender  : ['terrablender'],
]
if (!modSetMods.containsKey(modSet)) throw new GradleException("unknown -PmodSet=${modSet}; one of ${modSetMods.keySet()}")
def wanted = modSetMods[modSet]

tasks.register('fetchTestMods', Exec) {
	description = 'Downloads the selected mod set\'s jars into the test-mods cache when missing (sha512-checked).'
	commandLine(['bash', rootProject.file('scripts/fetch-test-mods.sh').absolutePath] + wanted)
	onlyIf { wanted.any { !new File(testModsDir, tmJar[it]).exists() } }
}
dependencies {
	if (modSet == 'terrablender') gametestCompileOnly files(new File(testModsDir, tmJar.terrablender))
	wanted.each { gametestRuntimeOnly files(new File(testModsDir, tmJar[it])) }
}
if (modSet != 'terrablender') {
	sourceSets.matching { it.name == 'gametest' }.configureEach { java.exclude '**/compat/tb/**' }
}
tasks.matching { it.name == 'compileGametestJava' && !wanted.isEmpty() }.configureEach { dependsOn 'fetchTestMods' }
tasks.matching { it.name in ['runGameTest', 'runClientGameTest'] && !wanted.isEmpty() }.configureEach { dependsOn 'fetchTestMods' }
// tell the tests which set this run is (the tests also look at the loaded mods)
tasks.matching { it.name in ['runGameTest', 'runClientGameTest'] }.configureEach { systemProperty 'fb.modSet', modSet }
if (findProperty('fb.compatOnly') == 'true') tasks.matching { it.name == 'runClientGameTest' }.configureEach { systemProperty 'fb.compatOnly', 'true' }

// --- Game test registration (no shared list) --------------------------------------------------------------------
// The gametest mod's fabric.mod.json keeps `@@SERVER_TESTS@@` / `@@CLIENT_TESTS@@` placeholders; processGametestResources
// fills them from a scan of the gametest sources (order: see below): a server test is any class with an `@GameTest`
// method, a client test any class that `implements FabricClientGameTest`. To add a test, add the class; touch no list.
def gametestScan = {
	def root = file('src/gametest/java')
	def serverRe = ~/(?m)^\s*@GameTest\b/
	def clientRe = ~/\bimplements\s+FabricClientGameTest\b/
	def server = [], client = [], ordered = []
	fileTree(root).matching { include '**/*.java' }.each { f ->
		def rel = root.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
		// compat/tb is only compiled for -PmodSet=terrablender (see the source set exclude above): register it only then
		if (modSet != 'terrablender' && rel.contains('compat/tb/')) return
		def text = f.getText('UTF-8')
		def m = text =~ /gametest-order:\s*(-?\d+)/
		def entry = [m.find() ? m.group(1) as int : 1000, rel.replaceAll(/\.java$/, '').replace('/', '.')]
		if (text =~ serverRe) server << entry
		if (text =~ clientRe) client << entry
		if (text.contains('gametest-order:')) ordered << entry[1]
	}
	def fmt = { list -> list.sort { a, b -> a[0] <=> b[0] ?: a[1] <=> b[1] }.collect { '"' + it[1] + '"' }.join(', ') }
	// -Pfb.serverTestOrder=reverse | shuffle:<seed> reorders the server test classes (an isolation check: no test may depend on
	// the order; TESTISO). The registration order also decides which test starts first among those whose chunks are ready.
	def order = findProperty('fb.serverTestOrder')?.toString()
	if (order) {
		server.sort { a, b -> a[0] <=> b[0] ?: a[1] <=> b[1] }
		if (order == 'reverse') server = server.reverse()
		else if (order.startsWith('shuffle:')) Collections.shuffle(server, new Random(order.substring(8) as long))
		else throw new GradleException("fb.serverTestOrder must be reverse or shuffle:<seed>, got ${order}")
		server = server.withIndex().collect { e, i -> [i, e[1]] }
	}
	// Guards: a scan that finds nothing, or misses a class that carries the order marker, must fail the build, not run no tests.
	if (server.isEmpty() || client.isEmpty()) throw new GradleException("game test scan found ${server.size()} server and ${client.size()} client test classes under src/gametest/java: the scan patterns in mod/build.gradle are broken")
	def missing = ordered.findAll { n -> !server.any { it[1] == n } && !client.any { it[1] == n } }
	if (!missing.isEmpty()) throw new GradleException("game test scan missed classes that carry a gametest-order marker: ${missing}")
	return [server: fmt(server), client: fmt(client)]
}
tasks.matching { it.name == 'processGametestResources' }.configureEach { t ->
	// the computed lists are inputs, so a change to the scan itself (not only to the sources) reruns the task
	t.inputs.property('gametestServerList', providers.provider { gametestScan().server })
	t.inputs.property('gametestServerOrder', providers.provider { findProperty('fb.serverTestOrder')?.toString() ?: '' })
	t.inputs.property('gametestClientList', providers.provider { gametestScan().client })
	t.filesMatching('fabric.mod.json') {
		filter { String line ->
			if (!line.contains('@@')) return line
			def s = gametestScan()
			line.replace('"@@SERVER_TESTS@@"', s.server).replace('"@@CLIENT_TESTS@@"', s.client)
		}
	}
}

// PERFSRV: renderer-free world half of scripts/perf.sh. A dedicated server (world seed and view distance come from the run dir's
// server.properties, written by scripts/perf.sh) with the game-test source set on the classpath; PerfServerHarness is loaded by the mod's
// -Dfb.testHook and halts the server when its rows are written. -Pfb.perfVariant=mod|base picks the world, -Pfb.perfOut=<dir> the output.
loom.runs {
	perfServer {
		server()
		source sourceSets.gametest
		runDir "build/run/perfServer"
		ideConfigGenerated false
		property 'fb.testHook', 'dev.fractalbuildings.gametest.perf.PerfServerHarness'
		property 'fb.perf.variant', (findProperty('fb.perfVariant') ?: 'mod').toString()
		property 'fb.perf.mode', (findProperty('fb.perfMode') ?: 'main').toString()
		property 'fb.perf.out', (findProperty('fb.perfOut') ?: layout.buildDirectory.dir('perf').get().asFile.path).toString()
	}
}
