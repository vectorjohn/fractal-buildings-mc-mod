plugins {
	id 'java-library'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// --- Boundary enforcement: planner-core must not know about Minecraft or Fabric. ---
// 1. No source file may import or mention net.minecraft / net.fabricmc / com.mojang.
// 2. No resolved configuration may contain a Minecraft/Fabric/Mojang dependency.
def forbiddenPattern = ~/\b(net\.minecraft|net\.fabricmc|com\.mojang)\b/
def forbiddenGroups = ['net.minecraft', 'net.fabricmc', 'com.mojang']

tasks.register('checkNoMinecraft') {
	group = 'verification'
	description = 'Fails if planner-core sources or dependencies reference Minecraft/Fabric.'
	def srcDirs = sourceSets.collect { it.allJava.srcDirs }.flatten().unique()
	def configs = configurations.matching { it.canBeResolved }
	inputs.files(sourceSets.main.allJava, sourceSets.test.allJava)
	doLast {
		def problems = []
		srcDirs.each { dir ->
			fileTree(dir).include('**/*.java').each { f ->
				f.readLines().eachWithIndex { line, i ->
					if (line =~ forbiddenPattern) {
						problems << "${f}:${i + 1}: ${line.trim()}"
					}
				}
			}
		}
		configs.each { c ->
			c.incoming.dependencies.each { d ->
				if (d.group != null && forbiddenGroups.any { d.group == it || d.group.startsWith(it + '.') }) {
					problems << "configuration ${c.name} declares ${d.group}:${d.name}"
				}
			}
			if (!problems && c.name in ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath']) {
				c.resolvedConfiguration.resolvedArtifacts.each { a ->
					def g = a.moduleVersion.id.group
					if (forbiddenGroups.any { g == it || g.startsWith(it + '.') }) {
						problems << "classpath ${c.name} contains ${g}:${a.name}"
					}
				}
			}
		}
		if (problems) {
			throw new GradleException("planner-core must not depend on Minecraft/Fabric:\n  " + problems.join('\n  '))
		}
	}
}

tasks.named('check') {
	dependsOn 'checkNoMinecraft'
}
// Also run before compiling so a violation fails fast.
tasks.named('compileJava') {
	dependsOn 'checkNoMinecraft'
}

// SampleFixtureTest compares the writer's output with the viewer's fixture; rerun when it changes.
tasks.named('test') {
	inputs.file('../viewer/fixtures/sample-house.json')
	inputs.files('../viewer/fixtures/sample-house-violations.json')
}

// Forward -Dfb.* options to the test JVM (e.g. -Dfb.propertyScale=10, -Dfb.dumpFixtures=DIR).
tasks.named('test') {
	systemProperties System.properties.findAll { it.key.toString().startsWith('fb.') }
}

// Run test classes in several JVMs (the suite is ~10 min serial). Each class is self-contained and
// determinism tests compare within one JVM, so forking per class is safe. Capped so that several
// agents building at once don't starve each other.
// FORKMEM: the fork count is also capped by memory. forks = max(1, min(6, cpus/3, (budget - 1.5 GiB) / (heap + 0.5 GiB))), where budget
// is the tightest cgroup v2 memory.max from this build's cgroup up to the root (like scripts/order-test.sh), else MemAvailable (the
// lower of the two when both apply). A perf worker job (MemoryMax 28 %, 7.9 GiB) gets 2 forks of 2g instead of 4, which peaked at 7.8G.
def testHeapMb = 2048
def testOverheadMb = 512
def reserveMb = 1536
def memBudget = { ->
	long best = -1L
	String src = 'unknown'
	try {
		def cgFile = new File('/proc/self/cgroup')
		def line = cgFile.exists() ? cgFile.readLines().find { it.startsWith('0::') } : null
		def cg = line ? line.substring(3).trim() : ''
		if (cg && cg != '/') {
			def d = new File('/sys/fs/cgroup' + cg)
			while (d != null && d.path != '/sys/fs/cgroup' && d.path != '/') {
				def f = new File(d, 'memory.max')
				def v = f.exists() ? f.text.trim() : 'max'
				if (v ==~ /\d+/ && (best < 0 || v.toLong() < best)) { best = v.toLong(); src = "cgroup memory.max ${v.toLong().intdiv(1048576)} MB (${d.path})" }
				d = d.parentFile
			}
		}
	} catch (Exception e) { /* fall through to MemAvailable */ }
	try {
		def m = new File('/proc/meminfo').readLines().find { it.startsWith('MemAvailable:') }
		if (m) {
			long avail = m.split(/\s+/)[1].toLong() * 1024L
			if (best < 0 || avail < best) { best = avail; src = "MemAvailable ${avail.intdiv(1048576)} MB" }
		}
	} catch (Exception e) { }
	return [best < 0 ? Long.MAX_VALUE : best, src]
}
def testForks = { ->
	int cpuForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(3))
	def (long budget, String src) = memBudget()
	int memForks = budget == Long.MAX_VALUE ? 6 : Math.max(1, (int) ((budget.intdiv(1048576) - reserveMb).intdiv(testHeapMb + testOverheadMb)))
	int forks = Math.max(1, Math.min(6, Math.min(cpuForks, memForks)))
	logger.lifecycle("planner-core tests: ${forks} forks (cpus/3 = ${cpuForks}, memory allows ${memForks}: ${src}, ${testHeapMb} MB heap + ${testOverheadMb} MB per fork, ${reserveMb} MB kept back)")
	return forks
}
tasks.named('test') {
	maxParallelForks = testForks()
	forkEvery = 0
	maxHeapSize = "${testHeapMb}m" // TESTSPEED2: the shared gate-window planners (GateWorld.sharedPlanner) hold about 70 MB each
}
