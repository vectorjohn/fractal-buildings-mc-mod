plugins {
	id 'application'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':planner-core')
	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
	mainClass = 'dev.fractalbuildings.cli.Main'
	applicationName = 'fractal-cli'
}

// IrJsonDeterminismTest compares CLI output with the committed viewer fixture; declare it so Gradle reruns the test when it changes.
tasks.named('test') {
	inputs.file('../viewer/fixtures/box5.json')
}
