// Root project: shared Java settings only. Modules are in planner-core/, cli/, mod/.
subprojects {
	tasks.withType(Test).configureEach {
		// TESTSPEED: tests tagged @Tag("heavy") (minutes each) are left out by default.
		// -PfbTests=heavy runs only them, -PfbTests=all runs everything (scripts/test-all.sh --planner-heavy uses heavy after the default run).
		def sel = project.findProperty('fbTests')
		useJUnitPlatform {
			if (sel == 'heavy') includeTags 'heavy'
			else if (sel != 'all') excludeTags 'heavy'
		}
	}
	tasks.withType(JavaCompile).configureEach {
		options.release = 25
		options.encoding = 'UTF-8'
	}
}

// REGENGOLDENS (workflow plan C9): one step that refreshes every golden and fixture the tests compare against. ONLY after a verified,
// intended change; read `git diff` afterwards. See docs/TESTING.md "Regenerating goldens".
tasks.register('regenGoldens') {
	group = 'verification'
	description = 'Regenerates all golden digests and fixtures (planner-core and cli). Only after a verified intended change.'
	dependsOn ':planner-core:regenGoldens', ':cli:regenGoldens'
}
