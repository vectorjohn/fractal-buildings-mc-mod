<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seed gallery</title>
    <style>
      html,body{margin:0;background:#1b1d22;color:#ddd;font:12px monospace}
      #wrap{position:relative;width:min(100vw,100vh);height:min(100vw,100vh)}
      canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
      .cell{position:absolute;box-sizing:border-box;border:1px solid #333;pointer-events:none}
      .cell.bad{border:3px solid #ff1a1a}
      .cell span{position:absolute;left:4px;top:2px;background:#000a;padding:0 3px}
      #msg{position:absolute;left:8px;bottom:8px;color:#f88}
    </style>
  </head>
  <body>
    <div id="wrap"><div id="msg"></div></div>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
