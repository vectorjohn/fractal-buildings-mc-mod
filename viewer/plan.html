<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan view</title>
    <style>
      html,body{margin:0;height:100%;background:#1b1d22;color:#ddd;font:12px sans-serif;overflow:hidden}
      #wrap{display:flex;height:100%}
      #stage{position:relative;flex:1;min-width:0}
      canvas{display:block;position:absolute;inset:0;cursor:grab}
      canvas.drag{cursor:grabbing}
      #side{width:230px;padding:8px;box-sizing:border-box;overflow:auto;border-left:1px solid #333;background:#16181c}
      #info{white-space:pre-wrap;line-height:1.45;margin-top:8px;min-height:12em}
      label{display:block;line-height:1.5}
      a{color:#8cf}
      .sw{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:middle}
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="stage"><canvas id="c"></canvas></div>
      <div id="side"><b id="title">Plan view</b><div id="layers"></div><div id="info"></div><div id="legend"></div></div>
    </div>
    <script type="module" src="/src/plan.ts"></script>
  </body>
</html>
